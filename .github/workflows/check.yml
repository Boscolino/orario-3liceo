name: Controllo orario

on:
  schedule:
    # GitHub Actions usa UTC. Lasciamo decidere allo script (src/main.ts,
    # modo "auto") cosa fare in base all'ora locale Europe/Rome — così il
    # comportamento resta corretto sia con l'ora solare che legale:
    #   06 locali                  -> controllo del mattino, notifica sempre
    #   07-13, 16, 18, 21 locali   -> controllo che notifica solo variazioni
    #   fuori da queste ore        -> lo script non fa nulla (nessuna chiamata al sito)
    # (le ore esatte sono in MORNING_HOUR / DAYTIME_HOURS più sotto)
    #
    # NOTA: i cron "schedule" di GitHub sono "best effort" e vengono
    # ritardati o SALTATI sotto carico, soprattutto quelli impostati
    # esattamente allo scoccare dell'ora (xx:00), il minuto più congestionato
    # della piattaforma. Per questo giriamo 4 volte all'ora, su minuti
    # decentrati: anche se GitHub ne salta la maggior parte, restano buone
    # probabilità che almeno un tentativo vada a segno in ogni ora utile
    # (in particolare quella delle 6, che deve notificare sempre).
    - cron: "6,21,36,51 4-20 * * 1-5"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Invia una notifica di prova invece del controllo"
        type: boolean
        default: false

# Un solo run alla volta; non annullare quello in corso (potrebbe star committando).
concurrency:
  group: controllo-orario
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLASS_SLUG: "3liceo"
      CLASS_NAME: "3 Liceo"
      SITE_HOST: "orario.rainerum.delugan.net"
      CHECK_WEEKS: "4"
      MAX_WEEKS: "45"
      TIMEZONE: "Europe/Rome"
      MORNING_HOUR: "6"
      DAYTIME_HOURS: "7,8,9,10,11,12,13,16,18,21"
      CALENDAR_NAME: "📚 Scuola"
      NTFY_SERVER: "https://ntfy.sh"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Controllo e sincronizzazione (automatico)
        if: ${{ inputs.test_notification != true && github.event_name == 'schedule' }}
        run: node src/main.ts check auto

      - name: Controllo e sincronizzazione (manuale)
        if: ${{ inputs.test_notification != true && github.event_name != 'schedule' }}
        run: node src/main.ts check morning

      - name: Notifica di prova
        if: ${{ inputs.test_notification == true }}
        run: node src/main.ts test-notify

      - name: Commit dello stato aggiornato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state docs
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "orario: aggiornamento $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
